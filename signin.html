<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  .popup{
    text-align: center;
    background-color: yellow;
    justify-self: center;
    overflow: hidden;
    width: 30%;
  }
  .popup .sign h4{
    display: inline;
    margin: 0;
    padding: 0;
    font-size: 30px;
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
  }
  .sign button{
    float: right;
    margin-right: 20px;
    margin-top:5px ;
    font-size: 20px;
  }
  .popup form input{
    font-size: 22px;
    width: 90%;
    height: 40px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 10px;
    padding: 5px;
    border: 2px solid darkblue;
    border-radius: 20px;
  }
  .popup form p,.popup form p a{
    text-decoration: none;
    padding: 0;
    margin: 0;
  }
</style>
<body>
  <div class="popup">
    <div class="sign">
      <h4>Sign In</h4>
      <button>X</button>
    </div><br>
    <form>
      <input type="email, text"  placeholder="Enter your email address or Username"><br>
      <input type="password" placeholder="Enter your password">
      <p><a href="#">Forget your password</a></p>
      <input type="submit" placeholder="Sign In">
    </form>
    <p>Or continue with</p>
    <p>Don't have an account? <a href="#">Sign Up</a></p>
  </div>
</body>
</html>
